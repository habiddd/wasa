server {
    listen 80;
    server_name _;

    location = /dashboard {
        return 301 /dashboard/;
    }

    # Proxy a flask-app antes que la regla estática de abajo (nginx matchea
    # la location más específica primero). Flask sigue validando
    # DASHBOARD_USER/DASHBOARD_PASSWORD el mismo (ver dashboard.py
    # _requiere_auth) -- no desactivamos ese chequeo, solo evitamos pedir
    # el Basic Auth dos veces con formatos distintos (htpasswd vs plano).
    location /dashboard/api/ {
        proxy_pass http://flask-app:5000/dashboard/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las actas firmadas suben por aquí; el límite por defecto de nginx (1 MB)
        # rechazaría un PDF con firmas incrustadas con un 413 antes de llegar a Flask.
        client_max_body_size 25m;
    }

    # El QR y las métricas solo importan detrás de login: protegemos el
    # shell estático igual que antes lo hacía Flask (antes de este cambio,
    # antes de que el frontend viviera en su propio contenedor).
    location /dashboard/ {
        auth_basic "Dashboard LACS";
        auth_basic_user_file /etc/nginx/.htpasswd;

        alias /usr/share/nginx/html/dashboard/;
        try_files $uri $uri/ /dashboard/index.html;
    }
}
