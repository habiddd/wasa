name: lacs-reservas-bot

networks:
  backend:
    driver: bridge

# Nombres fijos: los volúmenes se crearon cuando el proyecto se llamaba
# cpa-reservas-bot. Sin `name`, Docker los prefijaría con el nombre nuevo y
# arrancaría con la base vacía y sin la sesión de WhatsApp vinculada.
volumes:
  postgres_data:
    name: cpa-reservas-bot_postgres_data
  redis_data:
    name: cpa-reservas-bot_redis_data
  baileys_sessions:
    name: cpa-reservas-bot_baileys_sessions

services:

  # ---------------------------------------------------------------
  # Base de datos compartida: una instancia de Postgres, dos DBs
  # (evolution_db para Evolution API, reservas_db para tu app Flask)
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lacs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-changeme_super}
      POSTGRES_DB: postgres
      # Variables para el script de inicialización (01-init.sql)
      APP_DB_USER: ${APP_DB_USER:-reservas_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-changeme_app}
      APP_DB_NAME: ${APP_DB_NAME:-reservas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    ports:
      # Comenta esta línea si no necesitas acceso externo (pgAdmin, DBeaver, etc.)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lacs_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend

  # ---------------------------------------------------------------
  # Baileys: canal de WhatsApp no oficial (gratuito, QR)
  # ---------------------------------------------------------------
  baileys-bot:
    build:
      context: ./baileys-bot
    container_name: lacs_baileys_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      flask-app:
        condition: service_started
    ports:
      # Solo localhost: /send hace que el numero de la LACS envie mensajes.
      # Flask le habla por la red interna de Docker (http://baileys-bot:3000),
      # que no pasa por este puerto publicado.
      - "127.0.0.1:3000:3000"
    volumes:
      - baileys_sessions:/app/sessions
    environment:
      # URL del webhook de Flask (donde Baileys enviará los mensajes)
      FLASK_WEBHOOK_URL: http://flask-app:5000/webhook/whatsapp
      FLASK_QR_URL: http://flask-app:5000/webhook/qr
      FLASK_ACK_URL: http://flask-app:5000/webhook/ack
      FLASK_API_KEY: ${FLASK_API_KEY}
      BAILEYS_SESSION_DIR: /app/sessions
    networks:
      - backend

  # ---------------------------------------------------------------
  # Tu backend: lógica de reservas, guardrails, analítica, LLM
  # ---------------------------------------------------------------
  flask-app:
    build:
      context: ./flask-app
    container_name: lacs_flask_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${FLASK_SECRET_KEY}
      DATABASE_URL: postgresql://${APP_DB_USER:-reservas_user}:${APP_DB_PASSWORD:-changeme_app}@postgres:5432/${APP_DB_NAME:-reservas_db}
      REDIS_URL: redis://redis:6379/0

      # Baileys (servicio de WhatsApp no oficial)
      WHATSAPP_API_URL: http://baileys-bot:3000
      WHATSAPP_API_KEY: ${FLASK_API_KEY}

      # LLM local vía API compatible con OpenAI (Ollama / LM Studio).
      # Si LM Studio corre en el mismo Windows/Mac donde está Docker Desktop
      # (no dentro de otro contenedor), usa host.docker.internal en vez de
      # 127.0.0.1/localhost -- dentro del contenedor esos apuntan al propio
      # contenedor, no al host.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.3.167:9000}
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      LLM_API_KEY: ${LLM_API_KEY:-}

      # Página con el catálogo completo de equipos y espacios. Vacía = el bot
      # sigue listando todo el inventario cuando no identifica el activo (ver
      # recursos_service.evaluar_consulta_disponibilidad).
      CATALOGO_URL: ${CATALOGO_URL:-}

      # Guardrails
      MAX_MESSAGES_PER_MINUTE: ${MAX_MESSAGES_PER_MINUTE:-8}
      # "saludo" = conversación social (ver llm_client.responder_charla); no
      # toca la base de datos. "otro" queda fuera a propósito: es el que cae
      # al menú de fallback, y ese es el guardrail.
      ALLOWED_INTENTS: "reservar,consultar_disponibilidad,cancelar,ayuda,saludo"

      # Dashboard interno (/dashboard), protegido con autenticación básica
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    networks:
      - backend

  # ---------------------------------------------------------------
  # Frontend del dashboard (React/shadcn): estáticos servidos por Nginx,
  # con proxy de /dashboard/api/ hacia flask-app. Contenedor propio para
  # no acoplar el build de Node a la imagen del backend.
  # ---------------------------------------------------------------
  dashboard-frontend:
    build:
      context: ./dashboard-frontend
    container_name: lacs_dashboard_frontend
    restart: unless-stopped
    depends_on:
      flask-app:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    environment:
      # Mismas credenciales que flask-app: Nginx exige el login para servir
      # el shell estático (igual que antes hacía Flask); las peticiones a
      # /dashboard/api/ las sigue validando flask-app (ver dashboard.py
      # _requiere_auth), así que las credenciales no se duplican en un
      # tercer lugar.
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    networks:
      - backend
